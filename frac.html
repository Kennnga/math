<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дріб</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fef0e8;
    }

    #fraction {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #0041a5;
      font-size: min(30vh, 30vw);
      line-height: 1;
    }

    #numerator,
    #denominator {
      padding: 0 0.2em;
    }

    #line {
      width: 1.2em;
      height: 0.04em;
      background-color: #0041a5;
      margin: 0.08em 0;
    }

    button {
      margin-top: 40px;
      font-size: 24px;
      padding: 10px 20px;
      color: #ffffff;
      background-color: #0041a5;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #8dcef3;
      color: #1c1c1c;
    }
  </style>
</head>

<body>

  <div id="fraction">
    <div id="numerator">1</div>
    <div id="line"></div>
    <div id="denominator">2</div>
  </div>

  <button id="newFraction">Новий дріб</button>

  <script>
    // Крок 1. Можливі початкові дроби
    const fractions = [
      [1, 1], [1, 2], [1, 3], [1, 4], [1, 5],
      [2, 1], [2, 3], [2, 5],
      [3, 1], [3, 2], [3, 4], [3, 5],
      [4, 1], [4, 3], [4, 5],
      [5, 1], [5, 2], [5, 3], [5, 4]
    ];

    // Крок 2. Можливі множники
    const multipliers = [2, 3, 4, 5, 6, 7, 8];

    const numerator = document.getElementById("numerator");
    const denominator = document.getElementById("denominator");
    const button = document.getElementById("newFraction");

    function newFraction() {

      // Крок 1
      const fractionIndex = Math.floor(Math.random() * fractions.length);
      const [a, b] = fractions[fractionIndex];

      // Крок 2
      const multiplierIndex = Math.floor(Math.random() * multipliers.length);
      const multiplier = multipliers[multiplierIndex];

      // Крок 3
      numerator.textContent = a * multiplier;
      denominator.textContent = b * multiplier;
    }

    button.addEventListener("click", newFraction);
  </script>

</body>
</html>
