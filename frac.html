<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дріб</title>

  <style>
    :root {
      --блакитний: #8dcef3;
      --синій: #0041a5;
      --чорний: #1c1c1c;
      --бежевий: #fef0e8;
      --білий: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--бежевий);
    }

    /* Кнопка Назад у верхньому лівому куті */
    .back-button {
      position: fixed;
      top: 10px;
      left: 10px;
      background-color: var(--бежевий);
      border: 2px solid var(--чорний);
      border-radius: 0.5em;
      padding: 0.4em 1em;
      font-size: 0.9em;
      color: var(--чорний);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.3s ease;
      z-index: 1000;
      user-select: none;
    }

    .back-button:hover {
      border-color: var(--блакитний);
    }

    #fraction {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--синій);
      font-size: min(30vh, 30vw);
      line-height: 1;
    }

    #numerator,
    #denominator {
      padding: 0 0.2em;
    }

    #line {
      width: 1.2em;
      height: 0.04em;
      background-color: var(--синій);
      margin: 0.08em 0;
    }

    button {
      margin-top: 40px;
      font-size: 24px;
      padding: 10px 20px;
      color: var(--білий);
      background-color: var(--синій);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--блакитний);
      color: var(--чорний);
    }
  </style>
</head>

<body>

  <a href="index.html" class="back-button">← Назад</a>

  <div id="fraction">
    <div id="numerator">1</div>
    <div id="line"></div>
    <div id="denominator">2</div>
  </div>

  <button id="newFraction">Новий дріб</button>

  <script>
    // Крок 1. Групи дробів із різною частотою випадання

    const fractionGroups = [
      {
        weight: 1,
        fractions: [
          [1, 1]
        ]
      },
      {
        weight: 2,
        fractions: [
          [2, 1],
          [3, 1],
          [3, 2],
          [4, 1],
          [4, 3],
          [5, 1],
          [5, 2],
          [5, 3],
          [5, 4]
        ]
      },
      {
        weight: 5,
        fractions: [
          [1, 2],
          [1, 3],
          [1, 4],
          [1, 5],
          [2, 3],
          [2, 5],
          [3, 4],
          [3, 5],
          [4, 5]
        ]
      }
    ];

    // Крок 2. Можливі множники
    const multipliers = [2, 3, 4, 5, 6, 7, 8];

    const numerator = document.getElementById("numerator");
    const denominator = document.getElementById("denominator");
    const button = document.getElementById("newFraction");

    function newFraction() {

      // Крок 1. Обираємо групу з урахуванням її частоти
      const totalWeight = fractionGroups.reduce(
        (sum, group) => sum + group.weight,
        0
      );

      let randomWeight = Math.random() * totalWeight;
      let selectedGroup;

      for (const group of fractionGroups) {
        randomWeight -= group.weight;

        if (randomWeight < 0) {
          selectedGroup = group;
          break;
        }
      }

      // Випадково обираємо дріб із вибраної групи
      const fractionIndex = Math.floor(
        Math.random() * selectedGroup.fractions.length
      );

      const [a, b] = selectedGroup.fractions[fractionIndex];

      // Крок 2. Випадково обираємо множник
      const multiplierIndex = Math.floor(
        Math.random() * multipliers.length
      );

      const multiplier = multipliers[multiplierIndex];

      // Крок 3. Множимо чисельник і знаменник
      numerator.textContent = a * multiplier;
      denominator.textContent = b * multiplier;
    }

    button.addEventListener("click", newFraction);
  </script>

</body>
</html>
