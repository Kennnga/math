<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Множення</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fef0e8;
    }

    #example {
      font-size: 80vh;
      line-height: 1;
      color: #0041a5;
    }

    button {
      margin-top: 20px;
      font-size: 24px;
      padding: 10px 20px;
      color: #ffffff;
      background-color: #0041a5;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #8dcef3;
      color: #1c1c1c;
    }
  </style>
</head>

<body>

  <div id="example">5 · 3</div>

  <button id="changeButton">Інший приклад</button>

  <script>
    let previousA = 5;
    let previousB = 3;

    const example = document.getElementById("example");
    const button = document.getElementById("changeButton");

    button.addEventListener("click", function() {
      let a, b;

      do {
        a = Math.floor(Math.random() * 8) + 2;
        b = Math.floor(Math.random() * 8) + 2;
      } while (a === previousA && b === previousB);

      previousA = a;
      previousB = b;

      example.textContent = `${a} · ${b}`;
    });
  </script>

</body>
</html>
