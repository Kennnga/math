<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приклад на множення</title>
</head>
<body>

  <div id="example">5 · 3</div>

  <button id="changeButton">Інший приклад</button>

  <script>
    let previousA = 5;
    let previousB = 3;

    const example = document.getElementById("example");
    const button = document.getElementById("changeButton");

    button.addEventListener("click", function() {
      let a, b;

      do {
        a = Math.floor(Math.random() * 8) + 2; // 1–9
        b = Math.floor(Math.random() * 8) + 2; // 1–9
      } while (a === previousA && b === previousB);

      previousA = a;
      previousB = b;

      example.textContent = `${a} · ${b}`;
    });
  </script>

</body>
</html>
